---
- name: Deploy nginx and static site on web servers
  hosts: webservers
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Ensure nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy static index.html
      copy:
        content: |
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <title>Курсовая по DevOps</title>
            <style>
              body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background: #f4f4f4; }
              h1 { color: #0066cc; }
              .info { font-size: 20px; margin: 30px; padding: 20px; background: white; border-radius: 10px; display: inline-block; }
            </style>
          </head>
          <body>
            <h1>Отказоустойчивый сайт работает через ALB!</h1>
            <div class="info">
              <p><strong>Сервер:</strong> {{ inventory_hostname }}</p>
              <p><strong>Приватный IP:</strong> {{ ansible_host }}</p>
              <p><strong>Дата и время:</strong> {{ ansible_date_time.iso8601 }}</p>
            </div>
            <p>Курсовая работа по DevOps в Нетологии — выполнена ✅</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Restart nginx to apply changes
      service:
        name: nginx
        state: restarted
