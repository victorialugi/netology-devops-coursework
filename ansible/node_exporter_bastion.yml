---
- name: Install Node Exporter from bastion on all servers
  hosts: all
  become: yes
  tasks:
    - name: Copy tar.gz from bastion
      copy:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/node_exporter.tar.gz
        mode: '0644'
        remote_src: yes
        force: yes
      delegate_to: ubuntu@BASTION_PUBLIC_IP

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Move binary to /usr/local/bin
      copy:
        src: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes

    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/node_exporter.tar.gz
        - /tmp/node_exporter-1.8.2.linux-amd64

    - name: Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        home: /nonexistent
      ignore_errors: yes

    - name: Create systemd service
      copy:
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Start and enable Node Exporter
      service:
        name: node_exporter
        state: started
        enabled: yes
